[package]
name = "sequill-desktop"
description = "Sequill desktop app: the web UI on native SQLite, with an MCP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
default-run = "sequill"

[[bin]]
name = "sequill"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
sequill-core.workspace = true
sequill-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
percent-encoding = "2"
