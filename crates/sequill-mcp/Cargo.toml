[package]
name = "sequill-mcp"
description = "MCP server that lets AI assistants read and edit Sequill's SQLite databases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
sequill-core = { workspace = true, features = ["schema"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "3.10", features = ["server", "client", "macros", "schemars", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync", "time"] }

[dev-dependencies]
tempfile.workspace = true
