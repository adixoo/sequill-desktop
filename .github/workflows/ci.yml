# Checks every pull request and every push to master.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run version:check
      - run: bun run build

  desktop-e2e:
    name: Desktop end-to-end
    # Playwright reaches the app through WebView2, which only Windows has.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run desktop:build:debug
      - run: bun run test:e2e

  rust:
    name: Rust
    # Tauri's Linux build needs WebKitGTK 4.1, which Ubuntu 22.04 ships.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      # The desktop crate embeds ../dist at compile time, so build the frontend first.
      - run: bun run build
      - run: cargo test --workspace --locked
